name: Chart

# Publishes the chart as an OCI package on a v* tag.
#
# The tag is the release and must agree with Chart.yaml: a chart published as
# 0.2.0 from a tag reading v0.3.0 is a debugging session six months from now.
#
# A version already in the registry is never overwritten. ArgoCD consumes this
# by version, and a chart that moved underneath a pinned version is the failure
# mode this chart exists to make visible.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Lowercase: OCI reference grammar rejects capitals.
  CHART_REPO: ghcr.io/jamesatintegratnio/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: hack/lint.sh

      - name: Refuse a tag that disagrees with Chart.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart="$(helm show chart . | awk '/^version:/{print $2}')"
          [ "$tag" = "$chart" ] || {
            echo "::error::tag v${tag} does not match Chart.yaml version ${chart}"; exit 1; }

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          name=$(helm show chart . | awk '/^name:/{print $2}')
          version=$(helm show chart . | awk '/^version:/{print $2}')
          if helm show chart "oci://${CHART_REPO}/${name}" --version "$version" >/dev/null 2>&1; then
            echo "::error::${name} ${version} is already published; bump Chart.yaml"
            exit 1
          fi
          helm package . -d dist
          helm push "dist/${name}-${version}.tgz" "oci://${CHART_REPO}"

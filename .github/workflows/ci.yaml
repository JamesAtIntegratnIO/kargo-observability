name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # promtool parses every alert expression. Parsing is not evidence that a
      # query RETURNS anything -- see the README -- but an expression that does
      # not parse is a rule that silently never loads.
      - name: Install promtool
        run: |
          set -euo pipefail
          ver=3.7.3
          wget -qO- "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/prometheus-${ver}.linux-amd64/promtool" /usr/local/bin/
          promtool --version
          # lint.sh extracts .spec from the PrometheusRule for promtool, which
          # will not read a CRD. Installed explicitly rather than relied on:
          # a silently-missing PyYAML makes the check SKIP, and a skipped check
          # that reads as a pass is the failure mode this chart is about.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'
      - run: hack/lint.sh
